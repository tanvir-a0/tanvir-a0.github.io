<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - Tanvir's Robotics Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            color: white;
            font-family: 'Outfit', sans-serif;
        }

        .page-background {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('assets/images/backdrops/abstruct_2.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .test-container {
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* changed from center to allow scrolling if needed */
        }

        .test-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Glass Style */
        .glass {
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 2rem;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2),
                inset 0 4px 20px rgba(255, 255, 255, 0.3);

            /* Sizing and Layout for the Demo */
            width: 300px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 500;
            cursor: pointer;
            overflow: hidden;
            /* Important for ripple containment */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-top: 50px;
        }

        .glass:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                inset 0 4px 20px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .glass::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            backdrop-filter: blur(1px);
            box-shadow: inset -10px -8px 0px -11px rgba(255, 255, 255, 1),
                inset 0px -9px 0px -8px rgba(255, 255, 255, 1);
            opacity: 0.6;
            z-index: -1;
            filter: blur(1px) drop-shadow(10px 4px 6px black) brightness(115%);
        }

        /* Liquid Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.8s linear;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Background Image Element -->
    <div class="page-background"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div>
            <div class="logo">Tanvir Ahmed</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="test.html" class="active">Test Page</a></li>
            </ul>
            <div class="theme-toggle">
                <input type="checkbox" id="theme-switch" class="theme-checkbox">
                <label for="theme-switch" class="theme-label">
                    <span class="theme-icon sun">☀️</span>
                    <span class="theme-icon moon">🌙</span>
                    <div class="theme-ball"></div>
                </label>
            </div>
        </div>
    </nav>

    <!-- Test Content -->
    <section class="test-container">
        <div class="test-content">
            <h1>Liquid Glass</h1>
            <p>Click for Liquid Effect</p>

            <div class="glass">
                Touch Me
            </div>


        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Tanvir's Robotics Lab. Powered by GitHub Pages.</p>
    </footer>

    <script src="script.js?v=3"></script>
    <script>
        const glass = document.querySelector('.glass');
        glass.addEventListener('click', function (e) {
            // Use 'this' (the container) to get the rect, ensuring coordinates are relative to the container
            // regardless of which child element was actually clicked.
            let rect = this.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            let ripples = document.createElement('span');
            ripples.className = 'ripple';

            // Randomize size slightly for more organic feel
            let size = Math.random() * 50 + 50;
            ripples.style.width = size + 'px';
            ripples.style.height = size + 'px';

            // Center the ripple on the click coordinates
            ripples.style.left = (x - size / 2) + 'px';
            ripples.style.top = (y - size / 2) + 'px';

            this.appendChild(ripples);

            setTimeout(() => {
                ripples.remove();
            }, 1000);
        });
    </script>
</body>

</html>
